function summaryModal(){let c=get(),q=c.qcRuns.at(-1);let sect=(title,ico,content)=>`<section class="sum-section"><h3>${icon(ico)} ${title}</h3>${content}</section>`;let lines=(a,none)=>a.length?a.map((v,i)=>`<div class="sum-line"><span class="sum-num">${n(i+1)}</span><div>${v}</div></div>`).join(''):`<div class="sum-empty">${none}</div>`;modal('خلاصه عملیاتی پرونده',`<div class="sum-hero"><div class="device"><div class="glyph">${icon('phone')}</div><div><h2 dir="ltr">${esc(c.model)}</h2><div class="tiny">پذیرش ${n(c.id)} · ${esc(c.customer)}</div></div></div><div class="row">${pill(stageLabel(c),'ok')}${pill(pri[c.priority],'p'+c.priority)}</div></div><div class="sum-grid">${[['مسئول پرونده',esc(roleNames[c.tech]||'تخصیص داده نشده')],['مبلغ تأیید مشتری',c.approval||c.approved?money(c.approved):'هنوز تأیید نشده'],['موعد برآوردی',c.due?esc(jdisplay(c.due)):'تعیین نشده'],['آخرین کنترل کیفیت',q?(q.ok?'تأیید'+(q.reason==='تأیید مشروط'?' مشروط':''):'مردود / بازکاری'):'انجام نشده']].map(([k,v])=>`<div class="sum-kpi"><span>${k}</span><b>${v}</b></div>`).join('')}</div><div class="sum-sections">${sect('ایراد اعلام‌شده در پذیرش','phone',`<div class="sum-line">${esc(c.issue)}</div>`)}${sect('ایرادات تشخیص‌داده‌شده','tool',lines(c.faults.map(esc),'ایراد جدیدی ثبت نشده است.'))}${sect('عملیات فنی','tool',lines(c.ops.map(o=>esc(o.text)+'<div class="tiny muted">'+esc(roleNames[o.by]||o.by)+'</div>'),'هنوز اقدامی ثبت نشده است.'))}${sect('قطعات و تعهدات','box',c.parts.map(p=>partRow(p,false)).join('')||'<div class="sum-empty">قطعه‌ای ثبت نشده است.</div>')}${sect('نتیجه کنترل کیفیت','shield',q?`<div class="callout ${q.ok?'':'error'}">${esc(q.reason)}<div class="tiny">${esc(q.at)} · ${n(c.qcRuns.length)} نوبت تست</div></div>`:'<div class="sum-empty">کنترل کیفیت هنوز انجام نشده است.</div>')}${(role==='manager'||(isTech()&&db.settings.techs[role].profit))?`<div class="callout">مانده ناخالص پیش از اجرت داخلی و سایر هزینه‌ها: ${money(total(c)-c.parts.filter(p=>p.status==='used').reduce((s,p)=>s+p.qty*p.cost,0))}</div>`:''}</div>`);$('modal').querySelector('.modal').classList.add('summary-dialog')}
function caseAudit(){if(role!=='manager')return;modal('لاگ کامل پرونده',get().logs.map(x=>`<div class="listrow"><div>${esc(x.msg)}<div class="tiny muted">${esc(x.by)} · ${esc(x.at)}</div></div></div>`).join('')||'بدون رویداد')}
function assignPage(c){return block('تخصیص تکنسین مسئول','تکنسین پس از تحویل فیزیکی، دریافت دستگاه را تأیید می‌کند.',`<div class="stack">${select('assignTech',techOpts(),availableTechs()[0])}<div class="grid2"><div><label>اولویت</label>${select('assignPri',[[1,'بسیار فوری'],[2,'فوری'],[3,'عادی']],c.priority)}</div>${field('موعد برآوردی (در صورت اطلاع)','assignDue',c.due,'datetime-local')}</div></div>${actions(btn('ثبت ارجاع','assign()'))}`)}function assign(){let c=get(),t=$('assignTech').value;if(db.settings.techs[t].absent)return toast('تکنسین در مرخصی است');c.tech=t;c.priority=Number($('assignPri').value);c.originalPriority=c.priority;c.due=$('assignDue').value;change(c,'receive','تخصیص اولیه به '+roleNames[t])}
function managerCase(c){return block('مدیریت پرونده','فقط اقدام مدیریتی مرتبط با وضعیت جاری نمایش داده می‌شود.',`<div class="data"><div><span>مرحله جاری</span>${esc(stageLabel(c))}</div><div><span>مسئول</span>${esc(roleNames[c.tech]||'—')}</div><div><span>مبلغ تأیید مشتری</span>${money(c.approved)}</div><div><span>جمع پیش‌نویس</span>${money(total(c))}</div></div><div class="stack" style="margin-top:16px"><div class="grid2"><div><label>اولویت</label>${select('mgrPri',pri.map((p,i)=>[i,p]),c.priority)}</div>${field('موعد برآوردی','mgrDue',c.due,'datetime-local')}</div>${btn('ذخیره اولویت و موعد','managerUpdate()','secondary')}${c.tech&&['receive','diagnosis','approval','repair','invoice'].includes(c.stage)&&db.settings.edition==='pro'?btn('انتقال مسئولیت تکنسین','transferModal()','secondary'):''}${['qc','finance','closeout'].includes(c.stage)&&!c.reason?btn(c.invoiceRequest?'تأیید درخواست و اصلاح فاکتور':'اصلاح پیش‌نویس فاکتور','invoiceCorrection()','secondary'):''}${c.stage==='qc'?btn('مشاهده صف کنترل کیفیت',"go('qc')",'secondary'):''}${c.stage==='finance'||c.stage==='ready'?btn('مشاهده صف مالی و تحویل',"go('finance')",'secondary'):''}</div>`)}function managerUpdate(){let c=get();c.priority=Number($('mgrPri').value);c.due=$('mgrDue').value;commit(c,'اصلاح اولویت و موعد توسط مدیر')}
function receivePage(c){return block('تأیید دریافت دستگاه','دریافت فیزیکی دستگاه را ثبت کنید.',`<div class="data"><div><span>ایراد اولیه</span>${esc(c.issue)}</div><div><span>برآورد پذیرش</span>${money(c.estimate)}</div><div><span>متعلقات</span>بدون متعلقات (نمونه)</div><div><span>ارجاع‌دهنده</span>مدیر تعمیرگاه</div></div>${actions(btn('تأیید دریافت و شروع بررسی','receive()'))}`)}function receive(){let c=get();c.received=true;change(c,'diagnosis','تأیید دریافت فیزیکی')}
function diagnosisPage(c){return block('عیب‌یابی و برآورد','ایرادات جدید را ثبت و برآورد را تکمیل کنید.',`<div class="stack"><div class="callout">ایراد پذیرش: ${esc(c.issue)}</div>${c.faults.map((f,i)=>`<div class="listrow"><span>${esc(f)}</span>${btn('اصلاح',`editFault(${i})`,'ghost small')}</div>`).join('')}<div class="row"><div class="grow"><input id="fault" placeholder="شرح ایراد جدید" value="${esc(c.faultDraft||'')}" oninput="get().faultDraft=this.value;save()"></div>${btn('افزودن ایراد','addFault()','secondary')}</div><div class="grid2">${field('برآورد هزینه (تومان)','estimate',n(c.estimate),'text','inputmode="numeric" oninput="draftEstimate(this.value)"')}${field('موعد برآوردی اتمام','due',c.due,'datetime-local','onchange="draftDue(this.value)"')}</div></div>${actions(btn('ثبت برآورد و ادامه','diagnose()'))}`)}function draftEstimate(v){let x=val(v);if(Number.isFinite(x)&&x>=0){get().estimate=x;save()}}function draftDue(v){get().due=v;save()}function addFault(){let c=get(),v=$('fault').value.trim();if(!v)return toast('شرح ایراد را وارد کنید');c.faults.push(v);c.faultDraft='';commit(c,'ثبت ایراد: '+v)}function editFault(i){let c=get(),v=prompt('اصلاح شرح ایراد',c.faults[i]);if(v&&v.trim()){let prev=c.faults[i];c.faults[i]=v.trim();commit(c,'اصلاح ایراد: '+prev+' ← '+v)}}function diagnose(){let c=get(),x=val($('estimate').value);if(c.faultDraft?.trim())return toast('ابتدا ایراد در حال نگارش را ثبت یا پاک کنید');if(!Number.isFinite(x)||x<0||!$('due').value)return toast('مبلغ معتبر و موعد اتمام را وارد کنید');c.estimate=x;c.due=$('due').value;c.estimateHistory.push({amount:x,at:now()});if(c.approved>=x&&c.approved>0)change(c,'repair','برآورد مجدد در محدوده تأیید قبلی');else change(c,'approval','ثبت برآورد '+money(x))}
function approvalPage(c){let methods=db.settings.approval==='both'?[['phone','ثبت تأیید تلفنی'],['sms','شبیه‌سازی پاسخ پیامکی']]:[[db.settings.approval,db.settings.approval==='phone'?'ثبت تأیید تلفنی':'شبیه‌سازی پاسخ پیامکی']];return block('تأیید هزینه توسط مشتری','پس از ثبت موافقت، مرحله جاری بسته می‌شود.',`<div class="callout"><span class="tiny">مبلغ پیشنهادی</span><h1>${money(c.estimate)}</h1></div><div class="stack" style="margin-top:15px"><label>روش تأیید</label>${select('method',methods,methods[0][0])}</div>${actions(btn('عدم تأیید / انصراف','cancelModal()','danger')+btn('ثبت تأیید و ادامه','approveCustomer()'))}`)}function approveCustomer(){let c=get(),method=$('method').value,dest=c.resume||'repair';c.approved=c.estimate;c.approval={method,at:now(),by:role};delete c.resume;change(c,dest,'تأیید مشتری: '+money(c.approved)+' / '+(method==='phone'?'تلفنی':'پاسخ پیامکی آزمایشی'))}
const ps={requested:'درخواست انبار',approval:'انتظار مجوز مدیر',approved:'مجاز؛ در انتظار خرید',held:'تحویل / خرید ثبت شده',used:'مصرف‌شده',returning:'در انتظار عودت',returned:'عودت‌شده',supplier:'مرجوع تأمین‌کننده',damage:'ضایعات تأییدشده',nonrecoverable:'مصرف غیرقابل برگشت تأییدشده',cancelled:'لغوشده'};function partRow(p,act=true){return `<div class="listrow"><div class="grow"><strong>${esc(p.name)}</strong><div class="tiny muted">${n(p.qty)} عدد · ${p.source==='stock'?'انبار داخلی':'خرید خارجی'} · ${ps[p.status]||p.status}${canCost()&&p.cost!==undefined?' · خرید '+money(p.cost):''}${p.coreOpen?' · تعهد داغی باز':''}</div></div>${act&&p.status==='held'?btn('ثبت مصرف',`usePart('${p.id}')`,'secondary small')+btn('تعیین تکلیف',`disposeModal('${p.id}')`,'ghost small'):''}${act&&p.status==='approved'?btn('ثبت خرید واقعی',`externalComplete('${p.id}')`,'secondary small'):''}${act&&['requested','approval','approved'].includes(p.status)?btn('لغو',`cancelPart('${p.id}')`,'ghost small'):''}</div>`}
function repairPage(c){return block('عملیات تعمیر','اقدامات فنی و قطعات را در همین مرحله ثبت کنید.',`<div class="spread callout"><span>سقف هزینه تأییدشده</span><b>${money(c.approved)}</b></div><div class="sectionhead"><h3>اقدامات انجام‌شده</h3>${btn('افزایش برآورد','increaseModal()','secondary small')}</div>${c.ops.map((o,i)=>`<div class="listrow"><div>${esc(o.text)}<div class="tiny muted">${esc(roleNames[o.by]||o.by)}</div></div>${o.by===role?btn('اصلاح',`editOp(${i})`,'ghost small'):''}</div>`).join('')||'<p class="muted tiny">هنوز اقدامی ثبت نشده است.</p>'}<div class="row" style="margin-top:12px"><div class="grow"><input id="operation" placeholder="شرح اقدام فنی" value="${esc(c.opDraft||'')}" oninput="get().opDraft=this.value;save()"></div>${btn('ثبت اقدام','addOp()','secondary')}</div><div class="sectionhead"><h3>قطعات تعمیر</h3></div>${c.parts.map(p=>partRow(p)).join('')||'<p class="muted tiny">قطعه‌ای ثبت نشده است.</p>'}<div class="grid2" style="margin-top:12px">${btn('＋ درخواست قطعه از انبار',"partModal('stock')",'secondary')}${btn('＋ قطعه خارج از انبار',"partModal('external')",'secondary')}</div>${actions((db.settings.edition==='pro'&&db.settings.handover!=='disabled'?btn('ارجاع به تکنسین دیگر','transferModal()','secondary'):'')+btn('تعمیر نشد / انصراف','cancelModal()','danger')+btn('تعمیر شد؛ ادامه به فاکتور','finishRepair()'))}`)}function addOp(){let c=get(),v=$('operation').value.trim();if(!v)return toast('شرح عملیات را وارد کنید');c.ops.push({text:v,by:role});c.opDraft='';commit(c,'ثبت عملیات: '+v)}function editOp(i){let c=get(),o=c.ops[i];if(o.by!==role)return;let v=prompt('اصلاح عملیات',o.text);if(v&&v.trim()){let prev=o.text;o.text=v.trim();commit(c,'اصلاح عملیات: '+prev+' ← '+v)}}function increaseModal(){let c=get();modal('اصلاح برآورد',`<div class="stack">${field('برآورد جدید (تومان)','newEstimate',n(c.estimate))}${field('علت اصلاح','increaseReason')}${btn('ثبت و دریافت تأیید مجدد','increase()')}</div>`)}function increase(){let c=get(),x=val($('newEstimate').value),r=$('increaseReason').value.trim();if(!Number.isFinite(x)||x<0||!r)return toast('مبلغ و علت معتبر لازم است');c.estimate=x;c.estimateHistory.push({amount:x,reason:r,at:now()});closeModal();if(x>c.approved){c.resume=c.stage;change(c,'approval','افزایش برآورد: '+r)}else commit(c,'اصلاح برآورد: '+r)}
let partDraft=[],partMode='',picked='';function partModal(mode){partDraft=[];partMode=mode;picked='';drawPartModal()}
function drawPartModal(){let mode=partMode;modal(mode==='stock'?'درخواست قطعه از انبار':'ثبت قطعه خارج از انبار',`<div class="stack"><label>جست‌وجو در بانک قطعات</label><input id="partSearch" placeholder="مثلاً A50 یا نمایشگر" oninput="searchParts()"><div id="partResults" style="max-height:210px;overflow:auto"></div><div id="partNew"></div><input type="hidden" id="partProduct" value="${esc(picked)}"><div id="partHint" class="callout tiny"></div><div class="grid2">${field('تعداد','partQty','۱','text','inputmode="numeric"')}${mode==='external'?field('قیمت خرید واحد (تومان)','partCost','','text','inputmode="numeric"'):''}</div>${btn('＋ افزودن ردیف','queuePart()','secondary')}<div id="partDraft"></div>${btn(mode==='stock'?'ثبت همه درخواست‌ها':'ثبت همه خریدها / درخواست مجوز','addPart()')}</div>`);searchParts();drawPartDraft()}
function searchParts(){let q=digits($('partSearch').value).trim().toLowerCase(),list=db.catalog.filter(p=>(digits(p.name)+' '+digits(p.cat)).toLowerCase().includes(q)&&(partMode!=='stock'||p.stock>0));$('partResults').innerHTML=list.length?list.map(p=>`<button class="secondary part-hit ${picked===p.id?'sel':''}" onclick="partSelected('${p.id}')"><b>${esc(p.name)}</b><br><small>${esc(p.cat)} · موجودی ${n(p.stock)}</small></button>`).join(''):'<div class="empty">قطعه‌ای یافت نشد.</div>';if(partMode==='external')$('partNew').innerHTML=btn('＋ تعریف کالای جدید','newPartInline()','ghost');if(!list.some(p=>p.id===picked)){picked='';$('partProduct').value=''}updatePartHint()}
function partSelected(id){picked=id;$('partProduct').value=id;searchParts()}
function updatePartHint(){let p=db.catalog.find(x=>x.id===picked);$('partHint').textContent=p?'انتخاب: '+p.name+' · موجودی '+n(p.stock):'قطعه‌ای از فهرست انتخاب کنید.'}
function newPartInline(){let q=$('partSearch').value.trim(),cats=[...new Set(db.catalog.map(p=>p.cat))];$('partNew').innerHTML=`<div class="panel stack">${field('نام کالا','newPartName',q)}<label>دسته‌بندی</label>${select('newPartCat',[...cats.map(x=>[x,x]),['__new','＋ دسته‌بندی جدید']],cats[0]||'__new')}<div id="newCatBox">${field('نام دسته‌بندی جدید (در صورت انتخاب)','newCategory')}</div>${field('قیمت فروش پیشنهادی (تومان)','newSale','۰')}<label class="checkline"><input id="newCore" type="checkbox"> دارای تعهد داغی</label>${btn('تعریف کالا و انتخاب','createInlinePart()','secondary')}</div>`}
function createInlinePart(){let name=$('newPartName').value.trim(),cat=$('newPartCat').value==='__new'?$('newCategory').value.trim():$('newPartCat').value,sale=val($('newSale').value);if(!name||!cat||!Number.isFinite(sale)||sale<0)return toast('نام، دسته و قیمت معتبر لازم است');let old=db.catalog.find(p=>p.name.trim().toLowerCase()===name.toLowerCase());if(old){picked=old.id;toast('کالای موجود انتخاب شد')}else{let p={id:uid(),name,cat,stock:0,cost:0,sale,core:$('newCore').checked};db.catalog.push(p);picked=p.id;audit(null,'تعریف قطعه از پنجره خرید: '+name);toast('کالا با موجودی صفر تعریف شد')}$('partSearch').value=name;searchParts();partSelected(picked)}
function readPart(){let prod=db.catalog.find(p=>p.id===picked),q=val($('partQty').value);if(!prod||!Number.isInteger(q)||q<=0){toast('قطعه و تعداد معتبر انتخاب کنید');return null}let cost=partMode==='external'?val($('partCost').value):prod.cost;if(!Number.isFinite(cost)||cost<0||(partMode==='external'&&!$('partCost').value.trim())){toast('قیمت خرید معتبر وارد کنید');return null}let queued=partDraft.filter(x=>x.product===prod.id).reduce((s,x)=>s+x.qty,0);if(partMode==='stock'&&q+queued>prod.stock){toast('موجودی کافی نیست');return null}return {id:uid(),product:prod.id,name:prod.name,qty:q,cost,sale:prod.sale,source:partMode,by:role,status:partMode==='stock'?'requested':'held',core:prod.core,coreOpen:false}}
function queuePart(){let p=readPart();if(!p)return false;partDraft.push(p);picked='';$('partSearch').value='';$('partQty').value='۱';if($('partCost'))$('partCost').value='';searchParts();drawPartDraft();return true}
function drawPartDraft(){$('partDraft').innerHTML=partDraft.length?`<h3>ردیف‌های آماده ثبت (${n(partDraft.length)})</h3>${partDraft.map((p,i)=>`<div class="listrow"><div>${esc(p.name)} · ${n(p.qty)} عدد${p.source==='external'?' · '+money(p.qty*p.cost):''}</div>${btn('حذف',`dropPart(${i})`,'ghost small')}</div>`).join('')}`:''}
function dropPart(i){partDraft.splice(i,1);drawPartDraft()}

function unresolved(c){return c.parts.filter(p=>['held','returning'].includes(p.status)||p.coreOpen)}function closeoutPage(c){let open=unresolved(c);return block('تعیین تکلیف قطعات','قبل از انتقال، قطعات مصرف‌نشده و تعهدات داغی باید تسویه شوند.',`${c.reason?`<div class="callout warn">نتیجه: ${esc(c.reason)}</div>`:''}${open.map(p=>`<div class="listrow"><div>${partRow(p,false)}</div><div class="row">${p.status==='held'?btn('تعیین تکلیف',`disposeModal('${p.id}')`,'secondary small'):''}${p.coreOpen&&!p.coreRequested?btn('درخواست عودت داغی',`returnCore('${p.id}')`,'secondary small'):''}${p.coreRequested?pill('انتظار تأیید انبار','wait'):''}</div></div>`).join('')||'<div class="callout">تمام تعهدات قطعات تعیین تکلیف شده‌اند.</div>'}${actions((!c.reason?btn('بازگشت و اصلاح فاکتور','backInvoice()','secondary'):'')+btn('ادامه فرایند','finishCloseout()'))}`)}function backInvoice(){let c=get();change(c,'invoice','بازگشت از تعیین تکلیف برای اصلاح پیش‌نویس')}function disposeModal(id){let c=get(),p=c.parts.find(x=>x.id===id);modal('تعیین تکلیف قطعه',`<div class="stack"><b>${esc(p.name)} · ${n(p.qty)} عدد</b>${select('disposition',p.source==='stock'?[['stock','عودت به انبار'],['damage','ضایعات با تأیید مدیر'],...(p.wasUsed?[['nonrecoverable','مصرف غیرقابل برگشت با تأیید مدیر']]:[])]:[['stock','ورود به انبار'],['supplier','عودت به تأمین‌کننده'],['damage','ضایعات با تأیید مدیر'],...(p.wasUsed?[['nonrecoverable','مصرف غیرقابل برگشت با تأیید مدیر']]:[])],'stock')}${field('علت / توضیح','disposeReason')}${btn('ثبت درخواست تعیین تکلیف',`dispose('${id}')`)}</div>`)}function dispose(id){let c=get(),p=c.parts.find(x=>x.id===id),r=$('disposeReason').value.trim();if(!r)return toast('علت را وارد کنید');p.disposition=$('disposition').value;p.dispositionReason=r;p.status='returning';closeModal();commit(c,'درخواست تعیین تکلیف '+p.name+'؛ '+r)}function returnCore(id){let c=get(),p=c.parts.find(x=>x.id===id);p.coreRequested=true;commit(c,'درخواست عودت داغی '+p.name)}function finishCloseout(){let c=get();if(unresolved(c).length)return toast('تعهدات باز باید ابتدا تأیید شوند');if(c.reason||db.settings.qc==='off'){change(c,'finance','ارسال به مالی');return}c.qcDraft=null;change(c,'qc','ارسال به کنترل کیفیت')}
function stockPage(){let requests=db.cases.flatMap(c=>c.parts.filter(p=>p.status==='requested'||p.status==='approval'||p.status==='returning'||p.coreRequested).map(p=>({c,p})));let rows=requests.map(({c,p})=>`<div class="card stack"><div class="spread"><b>${esc(p.name)}</b>${pill(p.coreRequested?'عودت داغی':ps[p.status],'wait')}</div><span class="tiny muted">${esc(c.model)} · پذیرش ${n(c.id)} · ${roleNames[p.by]}</span><div>تعداد ${n(p.qty)} ${p.status==='approval'?'· '+money(p.qty*p.cost):''}</div><div class="row">${p.status==='approval'&&role==='manager'?btn('تأیید مجوز خرید',`stockAction('${c.id}','${p.id}','approve')`)+btn('رد درخواست',`stockAction('${c.id}','${p.id}','reject')`,'danger'):''}${p.status==='requested'?btn('تحویل فیزیکی قطعه',`stockAction('${c.id}','${p.id}','issue')`):''}${p.status==='returning'&&(!['damage','nonrecoverable'].includes(p.disposition)||role==='manager')?btn(p.disposition==='stock'?'تأیید دریافت فیزیکی':p.disposition==='supplier'?'تأیید مرجوعی تأمین‌کننده':'تأیید تعیین تکلیف مدیر',`stockAction('${c.id}','${p.id}','return')`):''}${p.coreRequested?btn('تأیید دریافت داغی',`stockAction('${c.id}','${p.id}','core')`,'secondary'):''}</div></div>`);return `<div class="intro"><div><div class="eyebrow">انبار و تأمین قطعات</div><h1>درخواست‌ها و تعهدات</h1><p class="muted">موجودی تنها پس از تحویل یا عودت فیزیکی تغییر می‌کند.</p></div>${role==='manager'?btn('بانک قطعات',"go('catalog')",'secondary'):''}</div><div class="cards">${rows.join('')||empty('درخواست بازی وجود ندارد.')}</div><div class="sectionhead"><h2>موجودی قطعات</h2></div>${catalogTable()}`}function stockAction(cid,pid,action){let c=db.cases.find(c=>c.id===cid),p=c.parts.find(p=>p.id===pid),prod=db.catalog.find(x=>x.id===p.product);if(action==='approve'&&role==='manager'&&p.status==='approval')p.status='approved';else if(action==='reject'&&role==='manager'&&p.status==='approval')p.status='cancelled';else if(action==='issue'&&p.status==='requested'){if(prod.stock<p.qty)return toast('موجودی کافی نیست');prod.stock-=p.qty;p.cost=prod.cost;p.status='held'}else if(action==='return'&&p.status==='returning'){if(['damage','nonrecoverable'].includes(p.disposition)&&role!=='manager')return;if(p.disposition==='stock'){if(p.source==='external'){let qty=prod.stock;prod.cost=Math.round((qty*prod.cost+p.qty*p.cost)/(qty+p.qty))}prod.stock+=p.qty;p.status='returned'}else p.status=p.disposition}else if(action==='core'&&p.coreRequested){p.coreRequested=false;p.coreOpen=false}else return;commit(c,'عملیات انبار / مجوز: '+p.name+' — '+action)}function catalogTable(){return `<div class="panel scroll"><table><thead><tr><th>نام قطعه</th><th>دسته</th><th>موجودی</th>${canCost()?'<th>بهای واحد</th>':''}<th>فروش</th><th>داغی</th></tr></thead><tbody>${db.catalog.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${n(p.stock)}</td>${canCost()?`<td>${money(p.cost)}</td>`:''}<td>${money(p.sale)}</td><td>${p.core?'دارد':'ندارد'}</td></tr>`).join('')}</tbody></table></div>`}function catalogPage(){return `<div class="intro"><div><h1>بانک اطلاعات قطعات</h1><p class="muted">کالاهای بدون موجودی نیز در جست‌وجو قابل انتخاب هستند.</p></div>${btn('افزودن قطعه','catalogModal()')}</div>${catalogTable()}`}function catalogModal(){modal('تعریف قطعه',`<div class="stack">${field('نام قطعه','catName')}${field('دسته‌بندی','catCategory')}${field('قیمت فروش واحد (تومان)','catSale','۰')}<label class="checkline"><input id="catCore" type="checkbox"> دارای تعهد داغی</label>${btn('ثبت کالا','addCatalog()')}</div>`)}function addCatalog(){let name=$('catName').value.trim(),cat=$('catCategory').value.trim(),sale=val($('catSale').value);if(!name||!cat||sale<0||!Number.isFinite(sale))return toast('اطلاعات معتبر وارد کنید');if(db.catalog.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('نام کالا تکراری است');db.catalog.push({id:uid(),name,cat,stock:0,cost:0,sale,core:$('catCore').checked});closeModal();commit(null,'تعریف قطعه '+name)}
function queuePage(type){let cs=db.cases.filter(c=>type==='qc'?c.stage==='qc':['finance','ready'].includes(c.stage));return `<div class="intro"><div><div class="eyebrow">${type==='qc'?'کنترل کیفیت':'امور مالی و تحویل'}</div><h1>${type==='qc'?'صف کنترل کیفیت':'صف مالی و تحویل'}</h1><p class="muted">پرونده‌های آماده اقدام به ترتیب اولویت.</p></div></div>${cs.length?`<div class="cards">${sorted(cs).map(card).join('')}</div>`:empty('پرونده‌ای در صف وجود ندارد.')}`}
function qcCase(c){if(!c.qcDraft)return block('دریافت دستگاه در QC','دریافت فیزیکی و بررسی خلاصه تعمیر.',`<div class="callout">${esc(c.issue)} · ${n(c.ops.length)} اقدام · ${n(c.parts.filter(p=>p.status==='used').length)} قطعه مصرفی</div>${actions((isTech()?btn('بازگشت و اصلاح فاکتور','invoiceCorrection()','secondary'):'')+btn('تأیید دریافت و شروع تست','qcStart()'))}`);let d=c.qcDraft;if(d.step===1)return block('اجرای آزمایش‌های کنترل کیفیت','برای هر آزمایش نتیجه را انتخاب کنید.',`<div class="qc-help"><b>راهنمای انتخاب نتیجه</b><p>قابل اعمال نیست: این تست برای دستگاه کاربرد ندارد. خرابی از قبل موجود: ایرادی مستند است که خارج از تعهد تعمیر فعلی بوده است.</p></div>${d.tests.map((t,i)=>`<div class="testrow"><div class="spread"><b>${esc(t.name)}</b><span class="tiny muted">${t.required?'الزامی':'اختیاری'} · ${esc(t.cat)}</span></div><div class="choices">${qcOptions(t).map(([v,l])=>`<button class="${t.result===v?'sel '+(v==='fail'?'fail':''):''}" onclick="qcSelect(${i},'${v}')">${l}</button>`).join('')}</div>${t.result&&t.result!=='pass'?`<input style="margin-top:8px" placeholder="${t.result==='prior'?'مرجع ثبت خرابی پیش از تعمیر':t.result==='na'?'چرا این تست کاربرد ندارد؟':'شرح ایراد مشاهده‌شده'}" value="${esc(t.note||'')}" oninput="qcNote(${i},this.value)">`:''}</div>`).join('')}${actions(btn('ثبت تست‌ها و ادامه','qcNext()'))}`);let failed=d.tests.some(t=>t.result==='fail'),conditional=d.tests.some(t=>t.result==='prior');return block('نتیجه کنترل کیفیت','ثبت نتیجه، فرم تست را می‌بندد.',`<div class="grid2"><div class="callout">تست سالم: ${n(d.tests.filter(t=>t.result==='pass').length)}</div><div class="callout ${failed?'error':''}">تست معیوب: ${n(d.tests.filter(t=>t.result==='fail').length)}</div></div>${failed?`<div class="stack" style="margin-top:16px">${field('شرح مردودی','qcReason',d.tests.filter(t=>t.result==='fail').map(t=>t.name+': '+t.note).join('، '))}<label>مقصد بازکاری</label>${select('qcDest',[['diagnosis','عیب‌یابی مجدد'],['repair','عملیات تعمیر مجدد']],'repair')}</div>${actions(btn('رد QC و بازگشت برای بازکاری','qcFinish(false)','danger'))}`:`<div class="callout" style="margin-top:16px">${conditional?'تأیید مشروط: خرابی‌های مستند خارج از تعهد تعمیر در نتیجه ثبت می‌شوند.':'کنترل کیفیت موفق؛ پرونده آماده مالی است.'}</div>${actions(btn('تأیید و ارجاع به مالی','qcFinish(true)'))}`}`)}
function qcStart(){let c=get();if(db.settings.qc==='independent'&&role!=='qc')return toast('QC مستقل فقط برای مسئول QC');if(db.settings.qc==='self'&&role!==c.tech)return toast('خودکنترلی توسط تکنسین مسئول انجام می‌شود');let cats=c.parts.filter(p=>p.status==='used').map(p=>db.catalog.find(x=>x.id===p.product)?.cat);c.qcDraft={step:1,tests:db.tests.filter(t=>t.active&&(t.cat==='عمومی'||cats.includes(t.cat))).map(t=>({...t,result:'',note:''})),at:now()};commit(c,'دریافت دستگاه و آغاز QC')}function qcSelect(i,v){let c=get();let t=c.qcDraft.tests[i];if(!qcOptions(t).some(x=>x[0]===v))return;t.result=v;t.note='';save();render()}function qcNote(i,v){get().qcDraft.tests[i].note=v;save()}function qcNext(){let c=get();if(c.qcDraft.tests.some(t=>((t.required||t.id==='t1')&&!t.result)||(t.result&&!qcOptions(t).some(x=>x[0]===t.result))||(t.result&&t.result!=='pass'&&!t.note.trim())))return toast('تست‌های الزامی و توضیحات را تکمیل کنید');c.qcDraft.step=2;commit(c,'ثبت نتایج آزمایش QC')}function qcFinish(ok){let c=get(),d=c.qcDraft;if(!ok&&!$('qcReason').value.trim())return toast('علت مردودی لازم است');let reason=ok?(d.tests.some(t=>t.result==='prior')?'تأیید مشروط':'تأیید شد'):$('qcReason').value.trim();c.qcRuns.push({tests:d.tests,reason,at:now(),by:role,ok,technician:c.tech,ts:Date.now()});c.qcDraft=null;if(ok){c.priority=c.originalPriority;change(c,'finance','QC: '+reason)}else{c.rework++;c.priority=0;change(c,$('qcDest').value,'مردودی QC و بازکاری: '+reason);if(c.rework>=db.settings.qcAlert)toast('هشدار: مردودی تکراری QC')}}
function financeCase(c){if(c.stage==='ready')return block('تحویل دستگاه به مشتری','تحویل واقعی را پس از احراز دریافت‌کننده ثبت کنید.',`${field('نام تحویل‌گیرنده','receiver',c.customer)}${actions(btn('ثبت تحویل واقعی','deliver()'))}`);let cost=c.parts.filter(p=>p.status==='used').reduce((s,p)=>s+p.qty*p.cost,0);return block('نهایی‌سازی مالی','پیش‌نویس فاکتور پس از QC یا تعیین تکلیف تعمیر ناموفق بررسی می‌شود.',`<div class="scroll"><table><thead><tr><th>شرح</th><th>مبلغ (تومان)</th></tr></thead><tbody>${c.parts.filter(p=>p.status==='used').map(p=>`<tr><td>${esc(p.name)} × ${n(p.qty)}</td><td>${n(p.qty*p.sale)}</td></tr>`).join('')}<tr><td>اجرت / هزینه توافقی</td><td>${n(c.labor)}</td></tr>${c.extras.map(x=>`<tr><td>${esc(x.name)}</td><td>${n(x.amount)}</td></tr>`).join('')}</tbody></table></div><div class="callout"><div class="spread"><b>مبلغ قابل پرداخت</b><h2>${money(total(c))}</h2></div>${canCost()?`<div class="tiny">بهای قطعات مصرفی: ${money(cost)}</div>`:''}</div>${c.reason?`<p class="muted">تعمیر نشده: ${esc(c.reason)}</p>`:''}${actions((!c.reason?btn('اصلاح پیش‌نویس فاکتور','invoiceCorrection()','secondary'):'')+btn('ثبت تسویه و آماده تحویل','finalize()'))}`)}function finalize(){let c=get();if(total(c)>c.approved||unresolved(c).length)return toast('تأیید مشتری یا تعهدات قطعات کامل نیست');c.paid=total(c);change(c,'ready','نهایی‌سازی فاکتور و تسویه '+money(c.paid))}function deliver(){let c=get(),r=$('receiver').value.trim();if(!r)return toast('نام تحویل‌گیرنده لازم است');c.deliveredAt=now();change(c,'done','تحویل واقعی به '+r)}
function settingsPage(){let s=db.settings;let tabs=[['flow','گردش‌کار'],['tests','آزمایش‌های QC'],['access','دسترسی تکنسین‌ها'],['wage','اجرت'],['reasons','علل ارجاع']];let b='';if(settingsTab==='flow')b=`<div class="stack"><div><label>نسخه تعمیرگاه</label>${select('edition',[['pro','Pro — چند تکنسین'],['solo','Solo — یک تکنسین']],s.edition)}</div><div><label>سیاست ارجاع بین تکنسین‌ها</label>${select('handover',[['direct','مستقیم با تأیید دریافت مقصد'],['manager','با تأیید مدیر و دریافت مقصد'],['disabled','صرفاً توسط مدیر']],s.handover)}</div><div><label>روش تأیید مشتری</label>${select('approval',[['both','تلفنی و پیامکی'],['phone','فقط تلفنی'],['sms','فقط پیامکی (آزمایشی)']],s.approval)}</div><div><label>سیاست خرید خارجی</label>${select('purchase',[['free','بدون مجوز مدیر'],['approval','همه خریدها با تأیید مدیر'],['limit','سقف اختصاصی هر تکنسین']],s.purchase)}</div><div><label>روش کنترل کیفیت</label>${select('qcPolicy',[['off','غیرفعال'],['self','خودکنترلی توسط تکنسین'],['independent','QC مستقل']],s.qc)}</div>${field('هشدار مدیر پس از چند بار مردودی','qcAlert',s.qcAlert,'number','min="1"')}${btn('ذخیره تنظیمات','saveFlow()')}</div>`;else if(settingsTab==='tests')b=`<div class="callout tiny">تغییرات در نوبت جدید QC اعمال می‌شوند؛ نتایج قبلی محفوظ می‌مانند.</div>${db.tests.map((t,i)=>`<div class="listrow"><div class="grow"><b>${esc(t.name)}</b><div class="tiny muted">${esc(t.cat)} · ${t.required?'الزامی':'اختیاری'} · ${t.active?'فعال':'غیرفعال'}</div></div><div class="row">${btn('↑',`moveTest(${i},-1)`,'ghost small')}${btn('↓',`moveTest(${i},1)`,'ghost small')}${btn('ویرایش',`testModal('${t.id}')`,'secondary small')}${btn(t.active?'غیرفعال':'فعال',`toggleTest('${t.id}')`,'ghost small')}</div></div>`).join('')}${actions(btn('＋ افزودن آزمایش',"testModal('')"))}`;else if(settingsTab==='access')b=`<div class="stack">${Object.entries(s.techs).map(([r,t])=>`<div class="panel"><h3>${roleNames[r]}</h3><div class="stack" style="margin-top:10px">${field('سقف مجموع خرید خارجی هر پرونده (تومان)','limit-'+r,n(t.limit))}<label class="checkline"><input id="cost-${r}" type="checkbox" ${t.cost?'checked':''}> مشاهده قیمت خرید و بهای تمام‌شده</label><label class="checkline"><input id="profit-${r}" type="checkbox" ${t.profit?'checked':''}> مشاهده سود ناخالص پرونده (صرفاً نمونه)</label><label class="checkline"><input id="editSale-${r}" type="checkbox" ${t.editSale?'checked':''}> ویرایش قیمت فروش در فاکتور</label></div></div>`).join('')}${btn('ذخیره دسترسی‌ها','saveAccess()')}</div>`;else if(settingsTab==='reasons')b=reasonSettings();else b=`<div class="stack"><label>روش محاسبه سهم داخلی تکنسین</label>${select('wagePolicy',[['none','بدون سهم مستقل (حقوق‌بگیر)'],['fixed','اجرت ثابت هر خدمت'],['percent','درصد از اجرت مشتری'],['manual','تعیین سهم توسط مدیر']],s.wage)}${field('درصد سهم تکنسین (در حالت درصدی)','wagePercent',s.percent,'number','min="0" max="100"')}<div class="callout">نمونه سهم از اجرت یک میلیون تومانی: ${money(s.percent*10000)}. تسویه واقعی سهم چند تکنسین در این نمونه انجام نمی‌شود.</div>${btn('ذخیره سیاست اجرت','saveWage()')}</div>`;return `<div class="intro"><div><div class="eyebrow">مدیریت سامانه</div><h1>تنظیمات تعمیرگاه</h1><p class="muted">فرایند و سطح اختیارات مطابق شیوه کار تعمیرگاه.</p></div></div><div class="tabs">${tabs.map(([v,l])=>btn(l,`setSettingsTab('${v}')`,settingsTab===v?'active':'')).join('')}</div><div class="panel" style="max-width:800px">${b}</div>`}function setSettingsTab(t){settingsTab=t;render()}function saveFlow(){let s=db.settings,edition=$('edition').value;if(edition==='solo'&&db.cases.some(c=>c.tech==='b'&&c.stage!=='done'))return toast('ابتدا پرونده‌های فعال تکنسین دوم را منتقل کنید');let a=Number($('qcAlert').value);if(!Number.isInteger(a)||a<1)return toast('آستانه معتبر وارد کنید');Object.assign(s,{edition,handover:$('handover').value,approval:$('approval').value,purchase:$('purchase').value,qc:$('qcPolicy').value,qcAlert:a});if(edition==='solo')db.cases.filter(c=>c.stage==='new').forEach(c=>{c.tech='a';c.stage='receive'});commit(null,'اصلاح تنظیمات گردش کار')}
function saveAccess(){for(let r of ['a','b']){let x=val($('limit-'+r).value);if(!Number.isFinite(x)||x<0)return toast('سقف خرید معتبر نیست')}for(let r of ['a','b']){let t=db.settings.techs[r];t.limit=val($('limit-'+r).value);for(let k of ['cost','profit','editSale'])t[k]=$(k+'-'+r).checked}commit(null,'اصلاح سطح دسترسی و سقف خرید')}
function saveWage(){let x=Number($('wagePercent').value);if(!Number.isFinite(x)||x<0||x>100)return toast('درصد معتبر نیست');db.settings.wage=$('wagePolicy').value;db.settings.percent=x;commit(null,'اصلاح سیاست اجرت')}
function testModal(id){let t=db.tests.find(x=>x.id===id)||{name:'',cat:'عمومی',required:true};let cats=['عمومی',...new Set(db.catalog.map(p=>p.cat))];modal(id?'ویرایش آزمایش':'افزودن آزمایش',`<div class="stack">${field('عنوان آزمایش','testName',t.name)}<label>دسته</label>${select('testCat',cats.map(c=>[c,c]),t.cat)}<label class="checkline"><input id="testRequired" type="checkbox" ${t.required?'checked':''}> الزامی</label>${btn('ثبت آزمایش',`saveTest('${id}')`)}</div>`)}function saveTest(id){let name=$('testName').value.trim();if(!name)return toast('عنوان آزمایش لازم است');let x={name,cat:$('testCat').value,required:$('testRequired').checked};if(id)Object.assign(db.tests.find(t=>t.id===id),x);else db.tests.push({id:uid(),active:true,...x});closeModal();commit(null,'اصلاح آزمایش QC: '+name)}function toggleTest(id){let t=db.tests.find(x=>x.id===id);t.active=!t.active;commit(null,'تغییر فعال بودن آزمایش '+t.name)}function moveTest(i,d){let j=i+d;if(j<0||j>=db.tests.length)return;[db.tests[i],db.tests[j]]=[db.tests[j],db.tests[i]];commit(null,'تغییر ترتیب آزمایش‌های QC')}
function peoplePage(){return `<div class="intro"><div><h1>مدیریت تکنسین‌ها</h1><p class="muted">بار کاری و وضعیت حضور؛ برای انتقال پرونده روی آن کلیک کنید.</p></div>${btn('دسترسی و سقف خرید',"settingsTab='access';go('settings')",'secondary')}</div><div class="grid2">${availableTechs().map(r=>{let cs=db.cases.filter(c=>c.tech===r&&c.stage!=='done');return `<div class="panel"><div class="spread"><h2>${roleNames[r]}</h2>${btn(db.settings.techs[r].absent?'ثبت حضور':'ثبت مرخصی',`absence('${r}')`,'secondary small')}</div><p class="muted tiny">${n(cs.length)} پرونده فعال · ${db.settings.techs[r].absent?'مرخصی':'حاضر'}</p>${cs.map(c=>`<div class="listrow"><div>${esc(c.model)}<div class="tiny muted">${stageLabel(c)}</div></div>${btn('مدیریت',`openCase('${c.id}')`,'secondary small')}</div>`).join('')}</div>`}).join('')}</div>`}function absence(r){db.settings.techs[r].absent=!db.settings.techs[r].absent;commit(null,'تغییر وضعیت حضور '+roleNames[r])}function auditPage(){if(role!=='manager')return empty('دسترسی ندارید');return `<div class="intro"><div><h1>لاگ و ممیزی</h1><p class="muted">فقط مدیر تعمیرگاه؛ تاریخچه اقدامات نمونه.</p></div></div><div class="panel scroll"><table><thead><tr><th>زمان</th><th>پذیرش</th><th>کاربر</th><th>رویداد</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td>${esc(a.at)}</td><td>${esc(a.case)}</td><td>${esc(a.by)}</td><td>${esc(a.msg)}</td></tr>`).join('')||'<tr><td colspan="4">هنوز رویدادی ثبت نشده است.</td></tr>'}</tbody></table></div>`}
// v6: structured reporting, no changes to workflow rules. Times are elapsed wall-clock, not hands-on timers.

function waitKeys(c){if(c.stage==='done')return [];let a=[];if(c.stage==='approval')a.push('customer');if(c.stage==='repair'&&c.parts.some(p=>['requested','approval','approved'].includes(p.status)))a.push('parts');if(c.stage==='ready')a.push('pickup');return a}
function bucket(c){if(c.stage==='done')return 'done';if(c.pending)return 'transfer';if(c.stage==='approval')return 'customer';if(c.stage==='repair'&&c.parts.some(p=>['requested','approval','approved'].includes(p.status)))return 'parts';if(['diagnosis','repair'].includes(c.stage)&&c.tech)return 'technical';return 'other'}
function syncMetrics(only=null,at=Date.now()){for(let c of only?[only]:db.cases){if(!c.metrics)c.metrics={started:at,spans:[],current:null,wait:{},qc:[]};let m=c.metrics;let keys=waitKeys(c);for(let k of Object.keys(m.wait))if(!keys.includes(k))delete m.wait[k];for(let k of keys)if(!m.wait[k])m.wait[k]=at;let b=bucket(c),t=c.tech||'';if(!m.current||m.current.bucket!==b||m.current.tech!==t){if(m.current&&at>=m.current.at)m.spans.push({...m.current,end:at});m.current={bucket:b,tech:t,at}}if(c.due&&!m.originalDue)m.originalDue=c.due;if(c.stage==='finance'&&!m.outcome){m.outcome={at,tech:t,reason:c.reason||'',due:m.originalDue||c.due||''}}if(c.stage==='done'&&!m.delivered)m.delivered={at,tech:m.outcome?.tech||t}}}
function initializeMetrics(){let fresh=!db.cases.some(c=>c.metrics);if(fresh){let at=Date.now(),hour=3600000;let base=db.cases[0];const mk=(id,model,customer,stage,tech,age,more={})=>({...JSON.parse(JSON.stringify(base)),id,model,customer,stage,tech,created:at-age*hour,stageAt:at-age*hour,priority:3,originalPriority:3,received:true,estimate:1200000,approved:1200000,issue:'نمونه آزمایشی',...more});db.cases.push(mk('1031','Samsung Galaxy A55','مریم حسینی','approval','a',30),mk('1032','Redmi Note 12','امیر رضایی','repair','b',80,{parts:[{id:'demo-wait-p',product:'p2',name:'فلت شارژ سامسونگ A50',qty:1,source:'stock',status:'requested',sale:250000,by:'b',core:false}]}),mk('1033','iPhone 13','سارا کریمی','ready','a',192,{paid:0,labor:0}),mk('1034','Samsung Galaxy S23','مهدی محمدی','diagnosis','a',5,{due:new Date(at-2*hour).toISOString().slice(0,16)}));for(let c of db.cases){syncMetrics(c,c.stageAt||c.created||at);if(c.stage==='ready')c.metrics.outcome={at:c.stageAt,tech:c.tech,reason:'',due:''}}}else syncMetrics();save()}
function followLimit(k){return Number(db.settings.followLimits?.[k]??followDefs[k][1])}
function followReasons(c,at=Date.now()){if(c.stage==='done')return [];let r=[];for(let k of ['customer','parts','pickup']){let start=c.metrics?.wait?.[k];if(start&&at-start>=followLimit(k)*3600000)r.push({k,age:at-start})}let due=Date.parse(c.due);if(Number.isFinite(due)&&due<at&&!['ready','done'].includes(c.stage))r.push({k:'late',age:at-due});return r}

function followupSummary(){let cs=db.cases.filter(c=>followReasons(c).length);return `<div class="panel" style="margin:18px 0"><div class="spread"><h3>پرونده‌های نیازمند پیگیری</h3>${btn('مشاهده '+n(cs.length)+' پرونده',"openFollow('all')",'secondary small')}</div><div class="grid2">${Object.entries(followDefs).map(([k,[label]])=>`<div class="listrow"><span>${label}</span>${btn(n(cs.filter(c=>followReasons(c).some(x=>x.k===k)).length)+' مورد',`openFollow('${k}')`,'ghost small')}</div>`).join('')}</div></div>`}
function followupPage(){if(role!=='manager')return empty('دسترسی ندارید');let cs=db.cases.map(c=>({c,r:followReasons(c)})).filter(x=>x.r.length&&(followFilter==='all'||x.r.some(r=>r.k===followFilter))).sort((a,b)=>Math.max(...b.r.map(x=>x.age))-Math.max(...a.r.map(x=>x.age)));return `<div class="intro"><div><div class="eyebrow">پیگیری عملیاتی</div><h1>پرونده‌های نیازمند پیگیری</h1><p class="muted">${n(cs.length)} پرونده یکتا؛ هر پرونده ممکن است چند علت داشته باشد.</p></div>${btn('تنظیم حدود زمانی','followSettings()','secondary')}</div><div class="tabs">${[['all','همه'],...Object.entries(followDefs).map(([k,v])=>[k,v[0]])].map(([k,label])=>btn(label,`openFollow('${k}')`,followFilter===k?'active':'')).join('')}</div><div class="cards">${cs.map(({c,r})=>`<article class="card case"><div class="spread"><b>${esc(c.model)}</b><span class="muted tiny">#${n(c.id)}</span></div><p>${esc(c.customer)} · ${esc(roleNames[c.tech]||'بدون مسئول')}</p>${r.map(x=>`<div class="callout warn tiny">${followDefs[x.k][0]} · ${ageLabel(x.age)}</div>`).join('')}<div class="case-current"><span class="tiny muted">وضعیت فعلی</span><b>${esc(stageLabel(c))}</b></div>${c.followNote?`<p class="tiny">آخرین پیگیری: ${esc(c.followNote.text)} · ${esc(c.followNote.at)}</p>`:''}<div class="actions">${btn('ثبت پیگیری',`followNote('${c.id}')`,'secondary small')}${btn('ورود به مرحله جاری',`openCase('${c.id}')`,'small')}</div></article>`).join('')||empty('پرونده‌ای با این شرایط وجود ندارد.')}</div><p class="tiny muted">ثبت پیگیری، زمان انتظار و وضعیت پرونده را تغییر نمی‌دهد. شمارنده‌ها با تغییر مرحله یا تعیین تکلیف درخواست به‌روزرسانی می‌شوند.</p>`}
function followSettings(){if(role!=='manager')return;modal('حدود زمانی پیگیری',`<div class="stack">${['customer','parts','pickup'].map(k=>field(followDefs[k][0]+' (ساعت)','follow-'+k,n(followLimit(k)),'text','inputmode="numeric"')).join('')}<div class="callout tiny">عبور از موعد برآوردی از همان لحظه گذشت موعد هشدار داده می‌شود.</div>${btn('ذخیره','saveFollowSettings()')}</div>`)}

function perfData(at=Date.now()){let [from,to]=perfBounds(at);at=to;return Object.keys(db.settings.techs).map(t=>{let outcomes=db.cases.map(c=>c.metrics?.outcome).filter(o=>o&&o.tech===t&&o.at>=from&&o.at<=at),delivered=db.cases.map(c=>c.metrics?.delivered).filter(o=>o&&o.tech===t&&o.at>=from&&o.at<=at),success=outcomes.filter(o=>!o.reason).length,failed=outcomes.filter(o=>o.reason==='تعمیر ناموفق').length,excluded=outcomes.length-success-failed,withDue=outcomes.filter(o=>o.due&&Number.isFinite(Date.parse(o.due))),ontime=withDue.filter(o=>o.at<=Date.parse(o.due)).length;let checks=db.cases.flatMap(c=>c.qcRuns||[]).filter(q=>q.technician===t&&q.ts>=from&&q.ts<=at&&typeof q.ok==='boolean'),rejected=checks.filter(q=>!q.ok).length,seconds={technical:0,customer:0,parts:0,transfer:0},worked=new Set();for(let c of db.cases){let m=c.metrics;if(!m)continue;let spans=[...m.spans,...(m.current?[{...m.current,end:at}]:[])];for(let x of spans){if(x.tech!==t||!(x.bucket in seconds))continue;let dur=Math.max(0,Math.min(at,x.end)-Math.max(from,x.at));seconds[x.bucket]+=dur;if(dur>0&&x.bucket==='technical')worked.add(c.id)}}return {t,completed:outcomes.length,delivered:delivered.length,success,failed,excluded,withDue:withDue.length,ontime,checks:checks.length,rejected,seconds,worked:worked.size,active:db.cases.filter(c=>c.tech===t&&c.stage!=='done').length}})}
function percent(a,b){return b?n(Math.round(a/b*100))+'٪ ('+n(a)+' از '+n(b)+')':'—'}

function managerStage(c){let base=managerCase(c);if(c.stage==='approval')return approvalPage(c)+base;if(c.stage==='repair'){let parts=c.parts.filter(p=>['requested','approval','approved','held','returning'].includes(p.status)||p.coreRequested);let rows=parts.map(p=>`<div class="panel stack">${partRow(p,false)}${p.status==='requested'?`<div class="tiny muted">موجودی: ${n(db.catalog.find(x=>x.id===p.product)?.stock||0)} عدد</div>${btn('تأیید تحویل فیزیکی قطعه',`stockAction('${c.id}','${p.id}','issue')`,'secondary')}`:''}${p.status==='approval'?actions(btn('تأیید مجوز خرید',`stockAction('${c.id}','${p.id}','approve')`)+btn('رد مجوز خرید',`stockAction('${c.id}','${p.id}','reject')`,'danger')):''}${p.status==='approved'?'<div class="callout tiny">منتظر ثبت خرید واقعی توسط تکنسین</div>':''}${p.status==='held'?'<div class="tiny muted">منتظر ثبت مصرف یا عودت توسط تکنسین</div>':''}${p.status==='returning'?btn('تأیید تعیین تکلیف فیزیکی',`stockAction('${c.id}','${p.id}','return')`,'secondary'):''}${p.coreRequested?btn('تأیید دریافت داغی',`stockAction('${c.id}','${p.id}','core')`,'secondary'):''}</div>`).join('');return block(parts.length?'مدیریت تأمین قطعات':'وضعیت عملیات تعمیر','مسئول فنی: '+esc(roleNames[c.tech]||'تخصیص داده نشده'),`<div class="stack">${rows||'<div class="callout">عملیات فنی در اختیار تکنسین مسئول است.</div>'}${parts.length?btn('تعیین تکلیف عدم تأمین / انصراف','cancelModal()','danger'):''}</div>`)+base}if(c.stage==='ready')return block('پیگیری تحویل دستگاه','دستگاه آماده تحویل است؛ تحویل واقعی صرفاً پس از احراز دریافت‌کننده ثبت می‌شود.',`<div class="data"><div><span>مبلغ فاکتور</span>${money(total(c))}</div><div><span>مدت انتظار</span>${elapsed(c)}</div></div>${actions(btn('ثبت نتیجه پیگیری',`followNote('${c.id}')`,'secondary'))}`)+financeCase(c);if(c.stage==='finance')return financeCase(c)+base;if(c.stage==='qc')return block('وضعیت کنترل کیفیت','آزمایش و نتیجه توسط کاربر مجاز QC ثبت می‌شود.',`<div class="callout">${c.qcDraft?'آزمایش‌ها در حال انجام است.':'در انتظار دریافت توسط مسئول QC'}</div>${actions(btn('مشاهده خلاصه تعمیر','summaryModal()','secondary'))}`)+base;if(c.stage==='closeout')return closeoutPage(c)+base;return block(stageLabel(c),'وضعیت جاری دستگاه',`<div class="callout">${c.stage==='diagnosis'?'تکنسین مسئول در حال عیب‌یابی است.':c.stage==='receive'?'منتظر تأیید دریافت فیزیکی تکنسین است.':c.stage==='invoice'?'منتظر تکمیل فاکتور توسط تکنسین است.':'مرحله جاری پرونده ثبت شده است.'}</div>`)+base}
function perfBounds(at=Date.now()){if(perfWindow==='custom'){let a=Date.parse(perfFrom),b=Date.parse(perfTo);return [Number.isFinite(a)?a:0,Number.isFinite(b)?Math.min(at,b):at]}return [perfWindow==='all'?0:at-Number(perfWindow)*86400000,at]}
function applyPerfRange(){let a=$('perfFrom').value,b=$('perfTo').value;if(!a||!b||Date.parse(a)>Date.parse(b))return toast('بازه تاریخ معتبر انتخاب کنید');perfFrom=a;perfTo=b;render()}
function perfValue(x,k){if(k==='success')return x.success+x.failed?x.success/(x.success+x.failed)*100:null;if(k==='qc')return x.checks?x.rejected/x.checks*100:null;if(k==='ontime')return x.withDue?x.ontime/x.withDue*100:null;return x[k]}

function perfRows(t,k){let [from,to]=perfBounds(),inRange=x=>x&&x.at>=from&&x.at<=to&&x.tech===t;return db.cases.filter(c=>{let o=c.metrics?.outcome;switch(k){case'completed':return inRange(o);case'delivered':return inRange(c.metrics?.delivered);case'success':return inRange(o)&&(!o.reason||o.reason==='تعمیر ناموفق');case'excluded':return inRange(o)&&o.reason&&o.reason!=='تعمیر ناموفق';case'qc':return (c.qcRuns||[]).some(q=>q.technician===t&&q.ts>=from&&q.ts<=to&&!q.ok);case'ontime':return inRange(o)&&o.due;case'active':return c.tech===t&&c.stage!=='done';default:return false}})}
function perfDetails(k){let names={completed:'پایان فنی',delivered:'تحویل شده',success:'نتیجه تعمیر',excluded:'سایر علل پایان بدون تعمیر',qc:'پرونده‌های مردود QC',ontime:'پرونده‌های دارای موعد',active:'پرونده‌های فعال'};let cs=perfRows(perfTech,k);modal(names[k],cs.map(c=>`<div class="listrow"><div><b>${esc(c.model)}</b><div class="tiny muted">پذیرش ${n(c.id)} · ${esc(c.reason||stageLabel(c))}${k==='qc'?' · '+esc((c.qcRuns||[]).filter(q=>!q.ok&&q.technician===perfTech&&q.ts>=perfBounds()[0]&&q.ts<=perfBounds()[1]).map(q=>q.reason).join('؛ ')):''}</div></div>${btn('باز کردن',`closeModal();openCase('${c.id}')`,'secondary small')}</div>`).join('')||'<div class="sum-empty">پرونده‌ای در این بازه ثبت نشده است.</div>')}
function perfTrend(t){let [from,to]=perfBounds();let events=db.cases.map(c=>c.metrics?.outcome).filter(o=>o&&o.tech===t&&o.at>=from&&o.at<=to);let days=new Map();for(let o of events){let d=new Date(o.at);let key=d.toLocaleDateString('fa-IR');let rec=days.get(key)||{label:key,num:0,at:o.at};rec.num++;days.set(key,rec)}let vals=[...days.values()].sort((a,b)=>a.at-b.at);if(!vals.length)return '<div class="sum-empty">هنوز رویداد پایان فنی در بازه انتخابی وجود ندارد.</div>';let max=Math.max(...vals.map(v=>v.num),1);return `<div class="perf-chart">${vals.map(v=>`<div class="perf-col"><b>${n(v.num)}</b><div class="stick" style="height:${v.num/max*100}px"></div><span>${esc(v.label)}</span></div>`).join('')}</div><p class="tiny muted">روزهای دارای رویداد پایان فنی؛ روزهای بدون رویداد نمایش داده نمی‌شوند.</p>`}
function performancePage(){if(role!=='manager')return empty('دسترسی ندارید');let data=perfData(),x=data.find(d=>d.t===perfTech)||data[0];if(!x)return empty('تکنسینی تعریف نشده است');perfTech=x.t;let metrics=[['completed','تعداد پایان فنی'],['success','نرخ موفقیت تعمیر'],['qc','نرخ مردودی QC'],['ontime','رعایت موعد اولیه'],['active','بار کاری فعلی']];let max=['success','qc','ontime'].includes(perfMetric)?100:Math.max(1,...data.map(d=>perfValue(d,perfMetric)||0));let [from,to]=perfBounds();let transfers={};for(let c of db.cases)for(let tr of c.transfers||[])if(tr.from===perfTech&&tr.at>=from&&tr.at<=to)transfers[tr.reasonLabel]=(transfers[tr.reasonLabel]||0)+1;let reasons=Object.entries(transfers).sort((a,b)=>b[1]-a[1]);let kpis=[['completed','پرونده‌های پایان فنی',n(x.completed)],['delivered','تحویل واقعی',n(x.delivered)],['success','نرخ موفقیت',percent(x.success,x.success+x.failed)],['qc','نرخ مردودی QC',percent(x.rejected,x.checks)],['ontime','رعایت موعد اولیه',percent(x.ontime,x.withDue)],['active','بار کاری فعلی',n(x.active)],['excluded','سایر علل پایان بدون تعمیر',n(x.excluded)]];return `<div class="intro"><div><div class="eyebrow">گزارش مدیریتی</div><h1>عملکرد واقعی تکنسین‌ها</h1><p class="muted">مقایسه کلی و گزارش مستقل هر تکنسین؛ از رویدادهای ثبت‌شده.</p></div></div><div class="panel stack"><div class="toolbar"><label>بازه گزارش</label>${select('perfPeriod',[['7','۷ روز اخیر'],['30','۳۰ روز اخیر'],['all','از شروع ثبت اطلاعات'],['custom','بازه دلخواه شمسی']],perfWindow).replace('<select','<select onchange="perfWindow=this.value;render()"')}</div>${perfWindow==='custom'?`<div class="grid2">${dateField('از تاریخ','perfFrom',perfFrom,'')}${dateField('تا تاریخ','perfTo',perfTo,'')}</div>${btn('اعمال بازه','applyPerfRange()','secondary')}`:''}<h3>مقایسه تکنسین‌ها</h3>${select('perfMetric',metrics,perfMetric).replace('<select','<select onchange="perfMetric=this.value;render()"')}${[...data].sort((a,b)=>perfMetric==='qc'?(perfValue(a,perfMetric)??Infinity)-(perfValue(b,perfMetric)??Infinity):(perfValue(b,perfMetric)??-1)-(perfValue(a,perfMetric)??-1)).map(d=>`<button class="perf-bar ${d.t===perfTech?'chosen':''}" onclick="perfTech='${d.t}';render()"><div class="spread"><b>${esc(roleNames[d.t]||d.t)}</b><span>${perfText(d,perfMetric)}</span></div><div class="bartrack"><div class="barfill" style="width:${(perfValue(d,perfMetric)||0)/max*100}%"></div></div></button>`).join('')}</div><div class="panel stack" style="margin-top:16px"><h2>گزارش اختصاصی تکنسین</h2><div class="grid2">${field('جست‌وجوی نام','perfSearch',perfSearch,'text','oninput="filterPerfTech(this.value)"')}<div><label>انتخاب تکنسین</label>${select('perfTech',data.map(d=>[d.t,roleNames[d.t]||d.t]),perfTech).replace('<select','<select onchange="perfTech=this.value;render()"')}</div></div><h3>${esc(roleNames[perfTech]||perfTech)}</h3><div class="perf-kpis">${kpis.map(([k,l,v])=>`<button class="perf-kpi" onclick="perfDetails('${k}')"><span>${l}</span><strong>${v}</strong><span>مشاهده پرونده‌ها ←</span></button>`).join('')}</div><h3>روند روزانه پایان فنی</h3>${perfTrend(perfTech)}<h3>تفکیک نتایج تعمیر</h3>${[['موفق',x.success],['ناموفق فنی',x.failed],['سایر علل',x.excluded]].map(([l,v])=>`<div class="spread"><span>${l}</span><b>${n(v)}</b></div><div class="bartrack"><div class="barfill" style="width:${x.completed?v/x.completed*100:0}%"></div></div>`).join('')}<h3>زمان‌های سپری‌شده</h3>${[['مراحل فنی',x.seconds.technical],['انتظار مشتری',x.seconds.customer],['انتظار قطعه / مجوز خرید',x.seconds.parts],['انتظار انتقال مسئولیت',x.seconds.transfer]].map(([l,v])=>`<div class="listrow"><span>${l}</span><b>${ageLabel(v)}</b></div>`).join('')}<p class="tiny muted">میانگین زمان مرحله فنی به ازای پرونده دارای زمان ثبت‌شده: ${x.worked?ageLabel(x.seconds.technical/x.worked):'داده کافی نیست'}</p><h3>علل انتقال مسئولیت از این تکنسین</h3>${reasons.map(([l,v])=>`<div class="spread"><span>${esc(l)}</span><b>${n(v)}</b></div><div class="bartrack"><div class="barfill" style="width:${v/reasons[0][1]*100}%"></div></div>`).join('')||'<p class="sum-empty">ارجاع پذیرفته‌شده‌ای با علت ساختاریافته در این بازه ثبت نشده است.</p>'}</div><div class="panel" style="margin-top:16px"><h3>مبنای محاسبه</h3><p>پرونده فقط یک بار به مسئول نهایی فنی نسبت داده می‌شود. نرخ موفقیت فقط تعمیر موفق و ناموفق فنی را دربرمی‌گیرد. مردودی بر اساس نوبت تست است؛ ارجاع و انتظار مشتری یا انبار ضعف تکنسین محسوب نمی‌شود. زمان مرحله فنی زمان سپری‌شده است، نه کار دستی. بار کاری فعلی مستقل از بازه است. داده‌ها آزمایشی هستند.</p></div>`}
function filterPerfTech(v){perfSearch=v;let x=$('perfTech');for(let o of x.options)o.hidden=!!v&&!o.text.includes(v);}

initializeMetrics();
render();
</script></body></html>
